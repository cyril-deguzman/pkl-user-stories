<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PKL Place — Partner Dashboard</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F4F4F7; color: #1a1a2e; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }

  /* LAYOUT */
  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar {
    width: 240px; min-width: 240px;
    background: linear-gradient(180deg, #2a1010 0%, #1a0808 55%, #0c0404 100%);
    color: #fff;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    border-right: 1px solid rgba(0,0,0,.2);
  }
  /* Decorative red glow + soft dot pattern echoing the login hero */
  .sidebar::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 18% 0%,  rgba(220,38,38,.28) 0%, transparent 45%),
      radial-gradient(circle at 110% 80%, rgba(220,38,38,.18) 0%, transparent 50%);
    pointer-events: none;
  }
  .sidebar::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 25% 35%, rgba(255,255,255,.5) 0.5px, transparent 0.6px),
      radial-gradient(circle at 70% 70%, rgba(255,255,255,.4) 0.5px, transparent 0.6px),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,.4) 0.5px, transparent 0.6px);
    background-size: 240px 240px, 180px 180px, 280px 280px;
    opacity: .18;
    pointer-events: none;
  }
  .main {
    flex: 1; overflow-y: auto;
    background:
      radial-gradient(circle at 100% 0%, rgba(220,38,38,.04) 0%, transparent 35%),
      radial-gradient(circle at 0% 100%, rgba(220,38,38,.03) 0%, transparent 30%),
      linear-gradient(180deg, #F7F8FA 0%, #F2F3F6 100%);
  }

  /* SIDEBAR */
  .sidebar-logo {
    padding: 22px 20px 18px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    position: relative; z-index: 1;
  }
  .logo-mark { display: flex; align-items: center; gap: 10px; }
  .logo-mark img.brand-icon { width: 34px; height: 34px; display: block; filter: drop-shadow(0 4px 12px rgba(220,38,38,.4)); }
  .logo-text {
    font-style: italic; font-weight: 900;
    font-size: 19px; letter-spacing: -.01em;
    line-height: 1;
    display: inline-flex; align-items: baseline;
  }
  .logo-text .pkl   { color: #EF4444; }
  .logo-text .place { color: #fff; }
  .logo-sub {
    font-size: 10px; font-weight: 700; color: rgba(255,255,255,.45);
    letter-spacing: .14em; text-transform: uppercase;
    margin-top: 10px;
  }

  .sidebar-nav { flex: 1; padding: 14px 10px; position: relative; z-index: 1; overflow-y: auto; }
  .nav-section { font-size: 10px; font-weight: 800; color: rgba(255,255,255,.35); letter-spacing: .12em; text-transform: uppercase; padding: 8px 12px 6px; margin-top: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 9px;
    cursor: pointer; font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,.7);
    transition: all .15s;
    margin-bottom: 2px;
    position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(220,38,38,.28) 0%, rgba(220,38,38,.08) 100%);
    color: #fff;
    font-weight: 600;
    box-shadow: inset 3px 0 0 #EF4444;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: #DC2626; color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; box-shadow: 0 2px 8px rgba(220,38,38,.4); }

  /* TIER PROGRESS BAR (XP-style) */
  .tier-progress {
    margin: 10px 14px 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    position: relative; z-index: 1;
  }
  .tier-progress-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .tier-progress-level { color: #fff; display: flex; align-items: center; gap: 6px; }
  .tier-num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 18px; padding: 0 4px;
    background: linear-gradient(135deg, #DC2626, #B91C1C);
    color: #fff; border-radius: 4px;
    font-size: 10px; font-weight: 900;
    box-shadow: 0 2px 6px rgba(220,38,38,.4);
  }
  .tier-progress-pct { color: #FCA5A5; font-variant-numeric: tabular-nums; }
  .tier-progress-bar {
    height: 8px;
    background: rgba(255,255,255,.08);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .tier-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #B91C1C, #EF4444, #F87171);
    border-radius: 999px;
    transition: width .8s ease;
    position: relative;
    overflow: hidden;
  }
  .tier-progress-fill::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    animation: shimmerXP 2.5s ease-in-out infinite;
  }
  @keyframes shimmerXP {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }
  .tier-progress-foot { margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.55); line-height: 1.4; }

  .sidebar-user {
    padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; gap: 10px;
    position: relative; z-index: 1;
  }
  .user-avatar {
    width: 38px; height: 38px;
    background: #FEE2E2; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #DC2626;
    flex-shrink: 0; overflow: hidden;
    border: 1.5px solid rgba(255,255,255,.18);
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role { font-size: 11px; color: rgba(255,255,255,.5); }

  /* NAV LOCKED — dark theme overrides */
  .nav-item.locked { color: rgba(255,255,255,.3); cursor: pointer; }
  .nav-item.locked:hover { background: rgba(255,255,255,.04); color: rgba(255,255,255,.5); }
  .nav-item .nav-lock { margin-left: auto; opacity: .5; }

  /* Global: ensure all inline SVGs inside buttons render at icon size (fixes Plus / Bell sizing) */
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* TOPBAR */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid #EAECF0; background: #fff; position: sticky; top: 0; z-index: 10; }
  .topbar-title { font-size: 20px; font-weight: 700; color: #1a1a2e; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; text-decoration: none; }
  .btn-primary { background: #DC2626; color: #fff; }
  .btn-primary:hover { background: #B91C1C; }
  .btn-outline { background: #fff; color: #374151; border: 1px solid #D0D5DD; }
  .btn-outline:hover { background: #f9fafb; }
  .btn-ghost { background: transparent; color: #DC2626; border: 1px solid #DC2626; }
  .btn-ghost:hover { background: #FEE2E2; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-danger { background: #DC2626; color: #fff; }
  .btn-danger:hover { background: #b91c1c; }

  /* CONTENT */
  .content { padding: 24px 28px; }

  /* CARDS */
  .card { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; }
  .card-body { padding: 20px 24px; }

  /* STAT CARDS */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 20px; }
  .stat-label { font-size: 12px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; color: #1a1a2e; line-height: 1; }
  .stat-delta { font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .stat-delta.up { color: #2E7D32; }
  .stat-delta.down { color: #DC2626; }
  .stat-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: .05em; padding: 10px 16px; border-bottom: 1px solid #EAECF0; text-align: left; white-space: nowrap; }
  td { padding: 14px 16px; border-bottom: 1px solid #F3F4F6; font-size: 14px; color: #374151; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FAFAFA; }
  .campaign-name { font-weight: 600; color: #1a1a2e; }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-active { background: #DCFCE7; color: #166534; }
  .status-paused { background: #FEF3C7; color: #92400E; }
  .status-ended { background: #F3F4F6; color: #6B7280; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-active { background: #22C55E; }
  .dot-paused { background: #F59E0B; }
  .dot-ended { background: #9CA3AF; }

  /* WALLET WIDGET */
  .wallet-widget { background: linear-gradient(135deg, #B91C1C 0%, #DC2626 100%); color: #fff; border-radius: 12px; padding: 20px 24px; display: flex; align-items: center; gap: 20px; }
  .wallet-balance-label { font-size: 12px; font-weight: 600; opacity: .8; text-transform: uppercase; letter-spacing: .06em; }
  .wallet-balance { font-size: 28px; font-weight: 700; margin: 4px 0; }
  .wallet-actions { display: flex; gap: 8px; }
  .wallet-btn { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.4); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .wallet-btn:hover { background: rgba(255,255,255,.3); }
  .wallet-divider { width: 1px; height: 48px; background: rgba(255,255,255,.25); margin: 0 4px; }

  /* SECTION HEADER */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-size: 16px; font-weight: 700; color: #1a1a2e; }
  .section-sub { font-size: 13px; color: #6B7280; margin-top: 2px; }

  /* WIZARD OVERLAY */
  .wizard-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: stretch; justify-content: flex-end; }
  .wizard-panel { background: #F7F8FA; width: 1040px; max-width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; animation: slideIn .25s ease; }
  @keyframes slideIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .wizard-header { background: #fff; border-bottom: 1px solid #EAECF0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .wizard-title { font-size: 17px; font-weight: 700; }
  .wizard-body { flex: 1; overflow-y: auto; display: flex; gap: 20px; padding: 24px; }
  .wizard-steps-container { flex: 1; min-width: 0; }
  .wizard-phone-col { width: 300px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; align-self: stretch; }
  .wizard-footer { background: #fff; border-top: 1px solid #EAECF0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }

  /* PROGRESS STEPS */
  .progress-steps { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
  .step-item { display: flex; align-items: center; gap: 8px; flex: 1; }
  .step-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; transition: all .2s; }
  .step-num.done { background: #DC2626; color: #fff; }
  .step-num.active { background: #DC2626; color: #fff; box-shadow: 0 0 0 4px #FEE2E2; }
  .step-num.pending { background: #E5E7EB; color: #9CA3AF; }
  .step-label { font-size: 12px; font-weight: 600; color: #6B7280; }
  .step-label.active { color: #DC2626; }
  .step-connector { flex: 1; height: 2px; background: #E5E7EB; margin: 0 4px; }
  .step-connector.done { background: #DC2626; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 9px 12px; border: 1px solid #D0D5DD; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; color: #1a1a2e; outline: none; transition: border .15s; }
  .form-input:focus { border-color: #DC2626; box-shadow: 0 0 0 3px #FEE2E2; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-hint { font-size: 12px; color: #9CA3AF; margin-top: 4px; }
  .form-select { width: 100%; padding: 9px 12px; border: 1px solid #D0D5DD; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; color: #1a1a2e; outline: none; background: #fff; cursor: pointer; }

  /* CREATOR — STATUS PILLS */
  .creator-status-eligible { background: #DCFCE7; color: #166534; }
  .creator-status-boosted { background: #FED7AA; color: #9A3412; }
  .creator-status-ineligible { background: #FEE2E2; color: #991B1B; }
  .creator-status-pending { background: #FEF3C7; color: #92400E; }
  .creator-status-paid { background: #DCFCE7; color: #166534; }

  /* ROLE BADGE / SWITCHER */
  .role-switcher { display: flex; gap: 4px; background: #F3F4F6; padding: 3px; border-radius: 8px; }
  .role-pill { padding: 6px 12px; font-size: 12px; font-weight: 600; color: #6B7280; cursor: pointer; border-radius: 6px; transition: all .15s; user-select: none; }
  .role-pill.active { background: #fff; color: #DC2626; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  /* ELIGIBILITY BANNER */
  .eligibility-banner { background: #E8F5E9; border: 1px solid #A7F3D0; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .eligibility-icon { width: 36px; height: 36px; background: #2E7D32; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .eligibility-title { font-size: 14px; font-weight: 700; color: #166534; }
  .eligibility-sub { font-size: 12px; color: #166534; opacity: .85; margin-top: 2px; }

  /* PAYOUT CARD (Earnings page hero) */
  .payout-hero { background: linear-gradient(135deg, #1F2937 0%, #111827 100%); color: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .payout-hero-label { font-size: 12px; opacity: .7; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .payout-hero-amount { font-size: 36px; font-weight: 700; margin: 6px 0; }
  .payout-hero-meta { font-size: 13px; opacity: .8; }

  /* TOGGLE GROUP */
  .toggle-group { display: flex; border: 1px solid #D0D5DD; border-radius: 8px; overflow: hidden; }
  .toggle-option { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; color: #6B7280; }
  .toggle-option.selected { background: #DC2626; color: #fff; }
  .toggle-option:hover:not(.selected) { background: #F3F4F6; }

  /* SKILL LEVEL CHECKBOXES */
  .skill-options { display: flex; flex-direction: column; gap: 8px; }
  .skill-option { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid #D0D5DD; border-radius: 8px; cursor: pointer; transition: all .15s; }
  .skill-option.selected { border-color: #DC2626; background: #FEE2E2; }
  .skill-option-title { font-size: 13px; font-weight: 600; }
  .skill-option-sub { font-size: 11px; color: #9CA3AF; }
  .skill-checkbox { width: 16px; height: 16px; border-radius: 4px; border: 2px solid #D0D5DD; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .skill-checkbox.checked { border-color: #DC2626; background: #DC2626; }

  /* REACH INDICATOR */
  .reach-box { background: #FEE2E2; border: 1px solid #FECACA; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .reach-icon { font-size: 20px; }
  .reach-label { font-size: 12px; color: #991B1B; font-weight: 500; }
  .reach-value { font-size: 18px; font-weight: 700; color: #DC2626; }

  /* VIDEO GRID */
  .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .video-thumb { aspect-ratio: 9/16; background: #F3F4F6; border-radius: 8px; cursor: pointer; border: 2px solid transparent; overflow: hidden; position: relative; transition: all .15s; }
  .video-thumb:hover { border-color: #DC2626; }
  .video-thumb.selected { border-color: #DC2626; box-shadow: 0 0 0 3px #FEE2E2; }
  .video-thumb-inner { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .video-play { width: 32px; height: 32px; background: rgba(0,0,0,.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .video-thumb-label { font-size: 11px; font-weight: 600; color: #6B7280; padding: 0 8px; text-align: center; }
  .video-upload-thumb { border: 2px dashed #D0D5DD; background: #FAFAFA; }
  .video-upload-thumb:hover { border-color: #DC2626; background: #FEF2F2; }
  .video-sel-check { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: #DC2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  /* BUDGET */
  .budget-input-wrap { position: relative; }
  .budget-prefix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 700; color: #374151; }
  .budget-input { padding-left: 28px !important; }
  .duration-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .duration-option { padding: 10px 8px; border: 1.5px solid #D0D5DD; border-radius: 8px; text-align: center; cursor: pointer; transition: all .15s; }
  .duration-option.selected { border-color: #DC2626; background: #FEE2E2; }
  .duration-option-days { font-size: 18px; font-weight: 700; color: #1a1a2e; }
  .duration-option-label { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
  .duration-option.selected .duration-option-days { color: #DC2626; }
  .cost-summary { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 14px; margin-top: 12px; }
  .cost-row { display: flex; justify-content: space-between; font-size: 13px; color: #374151; margin-bottom: 6px; }
  .cost-row:last-child { margin-bottom: 0; font-weight: 700; font-size: 14px; border-top: 1px solid #E5E7EB; padding-top: 8px; margin-top: 4px; }

  /* REVIEW */
  .review-section { margin-bottom: 16px; }
  .review-section-title { font-size: 12px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
  .review-item { display: flex; justify-content: space-between; font-size: 13px; color: #374151; padding: 6px 0; border-bottom: 1px solid #F3F4F6; }
  .review-item:last-child { border-bottom: none; }
  .review-item-label { color: #6B7280; }
  .review-item-value { font-weight: 600; color: #1a1a2e; }

  /* PHONE MOCKUP */
  .phone-mockup { width: 280px; background: #1a1a2e; border-radius: 40px; padding: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.28); border: 5px solid #2a2a3e; }
  .phone-screen { background: #fff; border-radius: 30px; overflow: hidden; }
  .phone-notch { width: 80px; height: 24px; background: #1a1a2e; margin: 0 auto; border-radius: 0 0 14px 14px; }
  .phone-feed { padding: 0; }
  .phone-feed-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #F3F4F6; }
  .phone-logo { width: 24px; height: 24px; background: #DC2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 900; }
  .phone-username { font-size: 13px; font-weight: 700; }
  .phone-sponsored { font-size: 10px; color: #9CA3AF; }
  .phone-video { width: 100%; aspect-ratio: 9/16; background: linear-gradient(180deg, #1a1a2e 0%, #4a1a1a 100%); display: flex; align-items: center; justify-content: center; position: relative; max-height: 360px; }
  .phone-video-play { width: 50px; height: 50px; background: rgba(255,255,255,.32); backdrop-filter: blur(4px); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .phone-video-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(0,0,0,.75), transparent); padding: 16px 12px 12px; }
  .phone-video-title { font-size: 12px; color: #fff; font-weight: 600; }
  .phone-cta { margin: 10px; background: #DC2626; color: #fff; border-radius: 10px; padding: 11px; text-align: center; font-size: 14px; font-weight: 700; cursor: pointer; }
  .phone-actions { display: flex; gap: 10px; padding: 8px 14px; border-top: 1px solid #F3F4F6; }
  .phone-action-btn { flex: 1; text-align: center; font-size: 11px; color: #6B7280; }
  .phone-home-bar { width: 80px; height: 5px; background: #D0D5DD; margin: 8px auto; border-radius: 3px; }
  .phone-label { font-size: 12px; font-weight: 700; color: #6B7280; text-align: center; margin-bottom: 10px; letter-spacing: .06em; text-transform: uppercase; }

  /* BILLING */
  .billing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .balance-card { background: linear-gradient(135deg, #B91C1C 0%, #DC2626 100%); color: #fff; border-radius: 12px; padding: 24px; }
  .balance-label { font-size: 12px; font-weight: 600; opacity: .8; text-transform: uppercase; letter-spacing: .06em; }
  .balance-amount { font-size: 36px; font-weight: 700; margin: 8px 0 16px; }
  .topup-card { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 24px; }
  .topup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .topup-btn { padding: 12px; border: 1.5px solid #D0D5DD; border-radius: 8px; text-align: center; cursor: pointer; font-weight: 700; font-size: 14px; color: #374151; transition: all .15s; }
  .topup-btn:hover { border-color: #DC2626; background: #FEE2E2; color: #DC2626; }
  .payment-card { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
  .payment-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F3F4F6; }
  .payment-item:last-child { border-bottom: none; }
  .payment-icon { width: 38px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  .payment-visa { background: #1A1F71; color: #fff; }
  .payment-gcash { background: #007DFF; color: #fff; }
  .payment-info { flex: 1; }
  .payment-name { font-size: 14px; font-weight: 600; }
  .payment-detail { font-size: 12px; color: #9CA3AF; }
  .default-tag { font-size: 11px; font-weight: 600; color: #DC2626; background: #FEE2E2; padding: 2px 8px; border-radius: 20px; }
  .tx-amount-pos { color: #2E7D32; font-weight: 600; }
  .tx-amount-neg { color: #DC2626; font-weight: 600; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 999; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: toastIn .3s ease; }
  @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 48px 24px; color: #9CA3AF; }
  .empty-state svg { width: 48px; height: 48px; margin: 0 auto 12px; }
  .empty-state-title { font-size: 16px; font-weight: 600; color: #4B5563; margin-bottom: 4px; }

  /* PROFILE */
  .profile-avatar-large { width: 72px; height: 72px; background: #FEE2E2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #DC2626; overflow: hidden; }
  .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* PROFILE TABS */
  .profile-tabs { display: inline-flex; gap: 2px; background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 4px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .profile-tab { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #6B7280; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 7px; user-select: none; }
  .profile-tab:hover:not(.active) { background: #F3F4F6; color: #1a1a2e; }
  .profile-tab.active { background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%); color: #DC2626; }

  /* EARNINGS TREND CHART */
  .trend-card { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 20px 24px; }
  .trend-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px; }
  .trend-head-left .stat-label { margin-bottom: 6px; }
  .trend-head-value { font-size: 26px; font-weight: 800; color: #1a1a2e; line-height: 1; letter-spacing: -.01em; }
  .trend-head-delta { font-size: 13px; color: #16A34A; font-weight: 600; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; }
  .trend-range-pills { display: inline-flex; gap: 2px; background: #F3F4F6; padding: 3px; border-radius: 8px; }
  .trend-range-pill { padding: 5px 10px; font-size: 11px; font-weight: 700; color: #6B7280; border-radius: 5px; cursor: pointer; transition: all .15s; user-select: none; }
  .trend-range-pill.active { background: #fff; color: #DC2626; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .trend-chart { height: 170px; position: relative; }
  .trend-chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .trend-grid { stroke: #F3F4F6; stroke-width: 1; }
  .trend-axis { font-size: 10px; fill: #9CA3AF; font-weight: 600; }

  /* ACTIVITY FEED */
  .activity-card { background: #fff; border: 1px solid #EAECF0; border-radius: 12px; padding: 0; overflow: hidden; }
  .activity-head { padding: 16px 20px; border-bottom: 1px solid #F3F4F6; display: flex; justify-content: space-between; align-items: center; }
  .activity-list { padding: 4px 20px 16px; }
  .activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F3F4F6; align-items: flex-start; }
  .activity-item:last-child { border-bottom: none; }
  .activity-icon { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .activity-body { flex: 1; min-width: 0; }
  .activity-title { font-size: 13px; color: #1a1a2e; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .activity-meta { font-size: 11px; color: #9CA3AF; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity-time { font-size: 11px; color: #9CA3AF; flex-shrink: 0; padding-top: 2px; }

  /* FOUNDING BADGE (sidebar) */
  .founding-badge { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #DC2626, #991B1B); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 10px; letter-spacing: .06em; margin-top: 3px; }

  /* VERIFICATION TOGGLE (top bar — replaces notif bell) */
  .verify-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px; border: 1px solid #D0D5DD; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; color: #4B5563; transition: all .15s; user-select: none; }
  .verify-toggle:hover { background: #FAFAFA; border-color: #B0B7C3; }
  .verify-toggle .vt-dot { width: 18px; height: 18px; border-radius: 50%; background: #9CA3AF; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; flex-shrink: 0; transition: background .15s; }
  .verify-toggle.verified { border-color: #FECACA; background: #FEF2F2; color: #991B1B; }
  .verify-toggle.verified .vt-dot { background: #DC2626; }
  .verify-toggle .vt-demo { font-size: 9px; font-weight: 800; letter-spacing: .08em; padding: 1px 5px; background: #E5E7EB; color: #6B7280; border-radius: 4px; margin-left: 2px; text-transform: uppercase; }
  .verify-toggle.verified .vt-demo { background: #FECACA; color: #991B1B; }

  /* CREATOR PROGRAM PAGE */
  .cp-hero { display: grid; grid-template-columns: 1fr 300px; gap: 20px; background: linear-gradient(120deg, #1a1a2e 0%, #2a1414 60%, #4a1a1a 100%); color: #fff; border-radius: 14px; padding: 22px 26px; margin-bottom: 18px; overflow: hidden; position: relative; }
  .cp-hero::after { content: ''; position: absolute; right: -60px; bottom: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(220,38,38,.45) 0%, transparent 70%); pointer-events: none; }
  .cp-hero-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #FCA5A5; margin-bottom: 8px; }
  .cp-hero-title { font-size: 24px; font-weight: 800; line-height: 1.18; margin-bottom: 8px; }
  .cp-hero-sub { font-size: 13px; opacity: .82; line-height: 1.5; max-width: 480px; }
  .cp-hero-readiness { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 16px; backdrop-filter: blur(4px); position: relative; z-index: 1; }
  .cp-ring-wrap { display: flex; align-items: center; gap: 16px; }
  .cp-ring { width: 84px; height: 84px; flex-shrink: 0; }
  .cp-ring-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
  .cp-ring-tier { font-size: 18px; font-weight: 800; margin: 4px 0 2px; }
  .cp-ring-meta { font-size: 12px; opacity: .8; }

  .cp-section-label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #6B7280; margin-bottom: 12px; }
  .cp-tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .cp-tier-card { background: #fff; border: 1.5px solid #EAECF0; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; transition: all .2s; }
  .cp-tier-card.qualified { border-color: #DC2626; box-shadow: 0 4px 18px rgba(220,38,38,.12); }
  .cp-tier-card.locked-future { background: repeating-linear-gradient(135deg, #FAFAFA, #FAFAFA 10px, #F3F4F6 10px, #F3F4F6 20px); border-style: dashed; border-color: #D0D5DD; }
  .cp-tier-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .cp-tier-num { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #DC2626; text-transform: uppercase; }
  .cp-tier-card.locked-future .cp-tier-num { color: #9CA3AF; }
  .cp-tier-name { font-size: 18px; font-weight: 800; color: #1a1a2e; margin-top: 2px; }
  .cp-tier-tag { font-size: 11px; color: #6B7280; margin-top: 4px; line-height: 1.4; }
  .cp-tier-status { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 4px 9px; border-radius: 999px; flex-shrink: 0; }
  .cp-status-current { background: #DC2626; color: #fff; }
  .cp-status-eligible { background: #DCFCE7; color: #166534; }
  .cp-status-progress { background: #FEF3C7; color: #92400E; }
  .cp-status-soon { background: #E5E7EB; color: #6B7280; }
  .cp-metrics { display: flex; flex-direction: column; gap: 12px; }
  .cp-metric { font-size: 12px; }
  .cp-metric-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .cp-metric-label { display: flex; align-items: center; gap: 6px; color: #374151; font-weight: 600; }
  .cp-metric-check { width: 14px; height: 14px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .cp-metric-check.met { background: #16A34A; }
  .cp-metric-check.unmet { background: #E5E7EB; color: #9CA3AF; }
  .cp-metric-value { font-size: 12px; font-weight: 700; color: #1a1a2e; font-variant-numeric: tabular-nums; }
  .cp-metric-value .target { color: #9CA3AF; font-weight: 500; }
  .cp-metric-bar { height: 5px; background: #F3F4F6; border-radius: 3px; overflow: hidden; }
  .cp-metric-fill { height: 100%; background: #DC2626; border-radius: 3px; transition: width .4s ease; }
  .cp-metric-fill.met { background: #16A34A; }

  .cp-rewards { display: flex; flex-wrap: wrap; gap: 6px; }
  .cp-reward-pill { font-size: 11px; font-weight: 600; color: #991B1B; background: #FEE2E2; padding: 4px 10px; border-radius: 999px; }
  .cp-tier-card.locked-future .cp-reward-pill { background: #E5E7EB; color: #6B7280; }
  .cp-tier-card .cp-apply-btn { margin-top: auto; }
  .cp-apply-btn { width: 100%; padding: 11px; border-radius: 9px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: all .15s; }
  .cp-apply-btn.enabled { background: #DC2626; color: #fff; }
  .cp-apply-btn.enabled:hover { background: #B91C1C; }
  .cp-apply-btn.disabled { background: #F3F4F6; color: #9CA3AF; cursor: not-allowed; }
  .cp-apply-btn.applied { background: #DCFCE7; color: #166534; cursor: default; }
  .cp-apply-btn.current { background: #FEE2E2; color: #DC2626; cursor: default; }

  /* CP "what you'll unlock" blurred preview */
  .cp-preview-wrap { position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 24px; border: 1px solid #EAECF0; background: #fff; }
  .cp-preview-blur { filter: blur(6px); opacity: .7; pointer-events: none; user-select: none; }
  .cp-preview-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.95) 80%); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; padding: 24px; text-align: center; }
  .cp-preview-lock { width: 44px; height: 44px; border-radius: 50%; background: #FEE2E2; display: flex; align-items: center; justify-content: center; color: #DC2626; }
  .cp-preview-title { font-size: 15px; font-weight: 700; color: #1a1a2e; }
  .cp-preview-sub { font-size: 12px; color: #6B7280; max-width: 360px; }

  /* EARNINGS BREAKDOWN (scalable donut + legend) */
  .eb-grid { display: grid; grid-template-columns: 200px 1fr; gap: 32px; align-items: center; }
  .eb-donut-wrap { position: relative; width: 180px; height: 180px; margin: 0 auto; }
  .eb-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; }
  .eb-donut-total { font-size: 22px; font-weight: 800; color: #1a1a2e; letter-spacing: -.01em; }
  .eb-donut-label { font-size: 10px; font-weight: 700; color: #9CA3AF; letter-spacing: .08em; text-transform: uppercase; }
  .eb-legend { display: flex; flex-direction: column; gap: 0; }
  .eb-legend-item { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #F3F4F6; }
  .eb-legend-item:last-child { border-bottom: none; }
  .eb-swatch { width: 4px; align-self: stretch; border-radius: 2px; flex-shrink: 0; min-height: 36px; }
  .eb-legend-info { flex: 1; min-width: 0; }
  .eb-legend-label { font-size: 13px; font-weight: 700; color: #1a1a2e; display: flex; align-items: center; gap: 6px; }
  .eb-legend-desc { font-size: 11px; color: #9CA3AF; margin-top: 2px; }
  .eb-legend-amounts { text-align: right; flex-shrink: 0; }
  .eb-legend-amount { font-size: 14px; font-weight: 700; color: #1a1a2e; font-variant-numeric: tabular-nums; }
  .eb-legend-pct { font-size: 11px; color: #6B7280; margin-top: 1px; }
  .eb-coming { font-size: 11px; color: #9CA3AF; display: flex; align-items: center; gap: 6px; font-style: italic; padding: 10px 0 4px; }
  .eb-coming-dot { width: 4px; align-self: stretch; min-height: 18px; border-radius: 2px; background: repeating-linear-gradient(180deg, #E5E7EB 0 4px, transparent 4px 8px); }

  /* ─── WALLET SPLIT (creator: two-wallet layout) ───────────────────────── */
  .wallet-split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .wallet-card { color: #fff; border-radius: 14px; padding: 22px 24px; position: relative; overflow: hidden; }
  .wallet-card.earnings { background: linear-gradient(135deg, #14532D 0%, #166534 60%, #15803D 100%); }
  .wallet-card.spend    { background: linear-gradient(135deg, #B91C1C 0%, #DC2626 100%); }
  .wallet-card-icon { position: absolute; top: 18px; right: 22px; opacity: .18; font-size: 78px; line-height: 1; pointer-events: none; }
  .wallet-card-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .wallet-card-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); font-size: 10px; font-weight: 700; }
  .wallet-card-amount { font-size: 32px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -.02em; }
  .wallet-card-meta { font-size: 12px; opacity: .82; line-height: 1.5; }
  .wallet-card-cta-row { display: flex; gap: 8px; margin-top: 16px; }
  .wallet-card-cta { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.36); border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s; color: #fff; font-family: inherit; }
  .wallet-card-cta:hover { background: rgba(255,255,255,.32); }

  /* ─── BOOST TABLE THUMBS & DESTINATION PILL ───────────────────────────── */
  .boost-thumb { width: 36px; height: 50px; border-radius: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .dest-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 20px; background: #F3F4F6; font-size: 12px; font-weight: 600; color: #374151; }
  .dest-pill-icon { font-size: 13px; line-height: 1; }

  /* ─── FOUNDING 100 CARD ───────────────────────────────────────────────── */
  .f100-card { display: grid; grid-template-columns: 220px 1fr; background: #0B0B0B; border-radius: 16px; overflow: hidden; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.18); margin-bottom: 20px; }
  .f100-card-left { background: linear-gradient(160deg, #1a0202 0%, #0a0000 100%); padding: 26px 22px; text-align: center; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
  .f100-card-left::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(220,38,38,.45) 0%, transparent 60%); pointer-events: none; }
  .f100-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .18em; opacity: .85; position: relative; z-index: 1; }
  .f100-number { font-size: 78px; font-weight: 900; line-height: .95; margin: 8px 0 0; letter-spacing: -.03em; position: relative; z-index: 1; }
  .f100-label { font-size: 13px; font-weight: 800; letter-spacing: .18em; margin-top: 4px; position: relative; z-index: 1; }
  .f100-sub { font-size: 11px; opacity: .65; margin-top: 14px; line-height: 1.5; position: relative; z-index: 1; }
  .f100-card-right { padding: 22px 26px; display: flex; flex-direction: column; gap: 12px; }
  .f100-eyebrow-r { font-size: 10px; font-weight: 800; color: #FCA5A5; letter-spacing: .14em; text-transform: uppercase; }
  .f100-title { font-size: 18px; font-weight: 800; margin-top: 3px; }
  .f100-benefits { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
  .f100-benefit { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; }
  .f100-benefit-icon { font-size: 15px; flex-shrink: 0; width: 22px; text-align: center; }
  .f100-benefit-label { font-weight: 600; line-height: 1.35; }
  .f100-benefit-detail { display: block; color: rgba(255,255,255,.55); font-size: 11px; margin-top: 1px; font-weight: 500; }
  .f100-status-row { display: flex; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); margin-top: auto; }
  .f100-status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: #DC2626; font-size: 11px; font-weight: 800; }
  .f100-status-pill.locked { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); }
  .f100-cta-btn { padding: 8px 16px; background: #DC2626; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s; font-family: inherit; }

// ─── EARNINGS TREND CHART (area chart, last 30 days) ─────────────────────────
function EarningsTrendChart({ data, total, deltaPct }) {
  const W = 800,H = 180,padX = 12,padY = 22,padBot = 24;
  const yMax = Math.max(...data) * 1.15;
  const xs = data.map((_, i) => padX + i / (data.length - 1) * (W - padX * 2));
  const ys = data.map((v) => H - padBot - v / yMax * (H - padY - padBot));

  // Smooth path via simple line (could swap to bezier later)
  const linePath = xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${ys[i]}`).join(' ');
  const areaPath = `${linePath} L ${xs[xs.length - 1]} ${H - padBot} L ${xs[0]} ${H - padBot} Z`;

  // X-axis labels — show 5 evenly-spaced dates
  const today = new Date();
  const labelIndices = [0, 7, 14, 22, 29];
  const dateAt = (daysAgoFromEnd) => {
    const d = new Date(today);
    d.setDate(d.getDate() - (data.length - 1 - daysAgoFromEnd));
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };

  return (
    <div className="trend-card" style={{ height: "326px" }}>
      <div className="trend-head">
        <div className="trend-head-left">
          <div className="stat-label">Earnings — Last 30 Days</div>
          <div className="trend-head-value">{fmt(total)}</div>
          <div className="trend-head-delta">↑ +{deltaPct}% vs previous 30 days</div>
        </div>
        <div className="trend-range-pills">
          {['7D', '30D', '90D', '1Y'].map((r) =>
          <div key={r} className={`trend-range-pill ${r === '30D' ? 'active' : ''}`}>{r}</div>
          )}
        </div>
      </div>
      <div className="trend-chart">
        <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
          <defs>
            <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#DC2626" stopOpacity="0.32" />
              <stop offset="100%" stopColor="#DC2626" stopOpacity="0" />
            </linearGradient>
          </defs>
          {/* Horizontal gridlines */}
          {[0.25, 0.5, 0.75, 1].map((p) => {
            const y = H - padBot - p * (H - padY - padBot);
            return <line key={p} className="trend-grid" x1={padX} y1={y} x2={W - padX} y2={y} />;
          })}
          {/* Area */}
          <path d={areaPath} fill="url(#trendGrad)" />
          {/* Line */}
          <path d={linePath} fill="none" stroke="#DC2626" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
          {/* End-of-line dot */}
          <circle cx={xs[xs.length - 1]} cy={ys[ys.length - 1]} r="4" fill="#fff" stroke="#DC2626" strokeWidth="2.5" />
          {/* X axis labels */}
          {labelIndices.map((i) =>
          <text key={i} className="trend-axis" x={xs[i]} y={H - 6} textAnchor="middle">
              {dateAt(i)}
            </text>
          )}
        </svg>
      </div>
    </div>);

}

function EarningsView({ creatorBalance, onNavigate }) {
  const totalThisMonth = CREATOR_VIDEOS.reduce((sum, v) => sum + totalEarned(v), 0);
  const totalQualifiedViews = CREATOR_VIDEOS.reduce((sum, v) => sum + v.qualifiedViews, 0);
  const totalTipCount = CREATOR_VIDEOS.reduce((sum, v) => sum + (v.tipCount || 0), 0);
  const eligibleCount = CREATOR_VIDEOS.filter((v) => v.status === 'Monetized').length;

  // Build donut data from EARNINGS_SOURCES (scales as new sources are added)
  const donutData = EARNINGS_SOURCES.map((s) => ({
    ...s,
    amount: sumSource(CREATOR_VIDEOS, s.key)
  }));
  const donutActive = donutData.filter((s) => s.amount > 0);
  const donutTotal = donutActive.reduce((sum, s) => sum + s.amount, 0);
  // Future / not-yet-earning sources still in the array
  const donutComing = donutData.filter((s) => s.amount === 0);

  // SVG ring segments (pathLength=100 normalizes to percentages)
  let cumulative = 0;
  const segments = donutActive.map((s) => {
    const pct = donutTotal > 0 ? s.amount / donutTotal * 100 : 0;
    const seg = { ...s, pct, offset: -cumulative };
    cumulative += pct;
    return seg;
  });

  const statusClass = (s) => {
    if (s === 'Monetized') return 'creator-status-eligible';
    if (s === 'Under Review') return 'creator-status-pending';
    if (s === 'Boosted') return 'creator-status-boosted';
    if (s === 'Not Eligible') return 'creator-status-ineligible';
    return '';
  };

  // Headline KPI cards — dynamically include every active EARNINGS_SOURCES entry
  const kpiCards = [
  { label: 'This Month', value: fmt(totalThisMonth), icon: '💵', bg: '#FEF2F2', color: '#DC2626' },
  ...donutData.map((s) => ({
    label: s.label,
    value: s.key === 'tips' ?
    `${totalTipCount} tips` :
    s.key === 'views' ? fmtK(totalQualifiedViews) : fmt(s.amount),
    sub: fmt(s.amount),
    icon: s.icon, bg: s.bg, color: s.color
  })),
  { label: 'Pending Payout', value: fmt(creatorBalance), icon: '⏳', bg: '#FEF3C7', color: '#92400E' }];


  return (
    <div>
      <div className="topbar">
        <div className="topbar-title">Creator Earnings</div>
        <div className="topbar-actions">
          <button className="btn btn-outline btn-sm" onClick={() => onNavigate('Payouts')}>
            View Payouts →
          </button>
        </div>
      </div>
      <div className="content">
        {/* Eligibility banner */}
        <div className="eligibility-banner">
          <div className="eligibility-icon">✓</div>
          <div style={{ flex: 1 }}>
            <div className="eligibility-title">Monetized — You're Earning</div>
            <div className="eligibility-sub">Tier 1 Partner · Earning from fan tips &amp; qualified views · Next review: June 1, 2026</div>
          </div>
        </div>

        {/* KPI cards (1 + sources + payout) */}
        <div className="stat-grid">
          {kpiCards.map((c, i) =>
          <div className="stat-card" key={i}>
              <div className="stat-icon" style={{ background: c.bg, fontSize: 18 }}>{c.icon}</div>
              <div className="stat-label">{c.label}</div>
              <div className="stat-value" style={{ color: c.color }}>{c.value}</div>
              {c.sub &&
            <div style={{ fontSize: 12, color: '#9CA3AF', marginTop: 4, fontWeight: 500 }}>{c.sub}</div>
            }
            </div>
          )}
        </div>

        {/* Earnings Breakdown — donut + legend (scalable: driven by EARNINGS_SOURCES) */}
        <div className="card" style={{ marginBottom: 20 }}>
          <div className="card-body">
            <div className="section-header" style={{ marginBottom: 18 }}>
              <div>
                <div className="section-title">Earnings Breakdown</div>
                <div className="section-sub">Where your {fmt(donutTotal)} came from this month</div>
              </div>
            </div>
            <div className="eb-grid">
              <div className="eb-donut-wrap">
                <svg viewBox="0 0 200 200" width="180" height="180">
                  {/* Track */}
                  <circle cx="100" cy="100" r="70" fill="none" stroke="#F3F4F6" strokeWidth="26" />
                  {segments.map((s, i) =>
                  <circle
                    key={s.key}
                    cx="100" cy="100" r="70"
                    fill="none"
                    stroke={s.color}
                    strokeWidth="26"
                    pathLength="100"
                    strokeDasharray={`${s.pct} ${100 - s.pct}`}
                    strokeDashoffset={s.offset}
                    transform="rotate(-90 100 100)"
                    style={{ transition: 'all .6s ease' }} />

                  )}
                </svg>
                <div className="eb-donut-center">
                  <div className="eb-donut-label">This month</div>
                  <div className="eb-donut-total">{fmt(donutTotal)}</div>
                </div>
              </div>
              <div className="eb-legend">
                {donutActive.map((s) => {
                  const pct = donutTotal > 0 ? Math.round(s.amount / donutTotal * 100) : 0;
                  return (
                    <div key={s.key} className="eb-legend-item">
                      <div className="eb-swatch" style={{ background: s.color }}></div>
                      <div className="eb-legend-info">
                        <div className="eb-legend-label">{s.icon} {s.label}</div>
                        <div className="eb-legend-desc">{s.desc}</div>
                      </div>
                      <div className="eb-legend-amounts">
                        <div className="eb-legend-amount">{fmt(s.amount)}</div>
                        <div className="eb-legend-pct">{pct}%</div>
                      </div>
                    </div>);

                })}
                {/* Coming-soon sources (zero or future minTier) appear faded so the model
                           visibly tells the user "more income streams coming". Hidden if none. */}
                {donutComing.length > 0 &&
                <div className="eb-coming">
                    <div className="eb-coming-dot"></div>
                    Coming with Tier 2: {donutComing.map((s) => s.label).join(', ')}
                  </div>
                }
              </div>
            </div>
          </div>
        </div>

        {/* Per-video performance */}
        <div className="card" style={{ marginBottom: 20 }}>
          <div className="card-body" style={{ borderBottom: '1px solid #EAECF0' }}>
            <div className="section-header">
              <div>
                <div className="section-title">Per-Video Performance</div>
                <div className="section-sub">{eligibleCount} of {CREATOR_VIDEOS.length} videos currently earning</div>
              </div>
            </div>
          </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Video</th>
                  <th>Total Views</th>
                  <th>Qualified Views</th>
                  <th>Fan Tips</th>
                  <th>Total Earned</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {CREATOR_VIDEOS.map((v) => {
                  const earned = totalEarned(v);
                  return (
                    <tr key={v.id}>
                      <td>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <div style={{ width: 32, height: 44, background: `linear-gradient(180deg, ${v.color} 0%, #2a4a1a 100%)`, borderRadius: 6, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3" /></svg>
                          </div>
                          <div>
                            <div className="campaign-name">{v.title}</div>
                            <div style={{ fontSize: 11, color: '#9CA3AF' }}>{v.duration}</div>
                          </div>
                        </div>
                      </td>
                      <td>{fmtK(v.totalViews)}</td>
                      <td>
                        {v.qualifiedViews > 0 ?
                        <span>{fmtK(v.qualifiedViews)} <span style={{ color: '#9CA3AF', fontSize: 12 }}>· {fmt(v.sources?.views || 0)}</span></span> :

                        <span style={{ color: '#9CA3AF' }}>0</span>

                      <td>
                        {v.tipCount > 0 ?

                        <span style={{ color: '#9CA3AF' }}>—</span>
                        }
                      </td>
                      <td>
                        <span style={{ fontWeight: 700, color: earned > 0 ? '#DC2626' : '#9CA3AF' }}>

                      </td>
                      <td>
                        <span className={`status-badge ${statusClass(v.status)}`} title={v.note || ''}>
                          {v.status === 'Boosted' && '⚡ '}
                          {v.status === 'Not Eligible' && '⊘ '}
                          {v.status}
                        </span>
                      </td>
                    </tr>);

                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* How earnings work — sources + statuses */}
        <div className="card card-body" style={{ marginBottom: 20 }}>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 20, marginBottom: 16 }}>

          <div style={{ borderTop: '1px solid #F3F4F6', paddingTop: 14, display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 14 }}>
            <div>

// ─── TIER PROGRESS HELPERS ────────────────────────────────────────────────────
// Computes XP-style progress toward the next reachable tier from current state.
function getTierProgress(metrics, tiers, currentTier) {
  const nextTier = tiers.find((t) => !t.locked && t.id > currentTier);
  if (!nextTier) return { current: tiers.find((t) => t.id === currentTier), nextTier: null, progressPct: 100 };
  const perMetric = nextTier.requirements.map((r) => {
    const have = metrics[r.key] ?? 0;
    return Math.min(100, have / r.target * 100);
  });
  const progressPct = Math.round(perMetric.reduce((s, m) => s + m, 0) / perMetric.length);
  return { current: tiers.find((t) => t.id === currentTier), nextTier, progressPct };
}

function TierProgressBar({ isCreatorVerified, currentTier }) {
  const { nextTier, progressPct } = getTierProgress(CREATOR_METRICS, CREATOR_TIERS, currentTier);
  if (!nextTier) {
    return (
      <div className="tier-progress">
        <div className="tier-progress-head">
          <span className="tier-progress-level"><span className="tier-num">MAX</span>All tiers unlocked</span>
        </div>
        <div className="tier-progress-bar"><div className="tier-progress-fill" style={{ width: '100%' }} /></div>
      </div>);

  }
  const label = isCreatorVerified ?
  `${progressPct}% to ${nextTier.name}` :
  progressPct >= 100 ? 'Ready to apply — Tier 1' : `${progressPct}% to apply for Tier 1`;
  return (
    <div className="tier-progress">
      <div className="tier-progress-head">
        <span className="tier-progress-level">
          <span className="tier-num">{isCreatorVerified ? `LVL ${currentTier}` : 'NEW'}</span>
          → Tier {nextTier.id}
        </span>
        <span className="tier-progress-pct">{progressPct}%</span>
      </div>
      <div className="tier-progress-bar"><div className="tier-progress-fill" style={{ width: progressPct + '%' }} /></div>
      <div className="tier-progress-foot">{label}</div>
    </div>);

}

  const totalCost = parseInt(budget || 0);
  const dailyCost = duration > 0 ? Math.round(totalCost / duration) : 0;
  const reach = Math.round(2200 * (totalCost / 500) * (duration / 7));
  const sufficientBalance = totalCost <= boostBalance;

  const canNext = () => {
    if (step === 1) return selectedVideo !== null && destinationLabel.length > 0;
    if (step === 2) return audience.location.length > 0;
    if (step === 3) return parseInt(budget) >= 50;
    return true;
  };

  const toggleSkill = (skill) => {
    setAudience((a) => {
      const skills = a.skills.includes(skill) ? a.skills.filter((s) => s !== skill) : [...a.skills, skill];
      return { ...a, skills };
    });
  };

  return (
    <div className="wizard-overlay" onClick={(e) => e.target.classList.contains('wizard-overlay') && onClose()}>
      <div className="wizard-panel">
        <div className="wizard-header">
          <div>
            <div className="wizard-title">🚀 Boost a Video</div>
            <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>Step {step} of 4 — {steps[step - 1]}</div>
          </div>
          <button className="btn btn-outline btn-sm" onClick={onClose} style={{ padding: '6px 10px' }}>
            <Icon.Close />
          </button>
        </div>
        <div className="wizard-body">
          <div className="wizard-steps-container">
            <div className="progress-steps">
              {steps.map((s, i) =>
                <React.Fragment key={i}>
                  <div className="step-item" style={{ flex: 'unset' }}>
                    <div className={`step-num ${i + 1 < step ? 'done' : i + 1 === step ? 'active' : 'pending'}`}>
                      {i + 1 < step ? <span style={{ color: '#fff', fontSize: 11 }}>✓</span> : i + 1}
                    </div>
                    <span className={`step-label ${i + 1 === step ? 'active' : ''}`}>{s}</span>
                  </div>
                  {i < steps.length - 1 && <div className={`step-connector ${i + 1 < step ? 'done' : ''}`}></div>}
                </React.Fragment>
              )}
            </div>

            {/* STEP 1 — VIDEO + DESTINATION */}
            {step === 1 &&
              <div className="card card-body">
                <div className="section-title" style={{ marginBottom: 14 }}>Select Your Video</div>
                <div className="video-grid">
                  {CREATOR_VIDEOS.map((v) =>
                    <div key={v.id} className={`video-thumb ${selectedVideo === v.id ? 'selected' : ''}`} onClick={() => setSelectedVideo(v.id)}>
                      <div className="video-thumb-inner" style={{ background: `linear-gradient(180deg, ${v.color} 0%, #2a4a1a 100%)` }}>
                        <div className="video-play">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3" /></svg>
                        </div>
                        <div style={{ color: '#fff', fontSize: 10, textAlign: 'center', padding: '0 6px', fontWeight: 600 }}>{v.title}</div>
                        <div style={{ color: 'rgba(255,255,255,.6)', fontSize: 9 }}>{v.duration}</div>
                      </div>
                      {selectedVideo === v.id &&
                        <div className="video-sel-check">
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12" /></svg>
                        </div>
                      }
                    </div>
                  )}
                </div>

                <div style={{ marginTop: 20 }}>
                  <div className="section-title" style={{ marginBottom: 8, fontSize: 14 }}>Where should viewers land?</div>
                  <div style={{ fontSize: 12, color: '#6B7280', marginBottom: 12 }}>Pick what tapping your boosted video opens.</div>
                  <div className="dest-grid">
                    {DESTINATION_OPTIONS.map((d) =>
                      <div key={d.id} className={`dest-option ${destination === d.id ? 'selected' : ''}`} onClick={() => setDestination(d.id)}>
                        <div className="dest-option-icon">{d.icon}</div>
                        <div className="dest-option-label">{d.label}</div>
                      </div>
                    )}
                  </div>
                  <div className="form-group">
                    <label className="form-label">{dest?.label || 'Destination'} details</label>
                    <input
                      className="form-input"
                      value={destinationLabel}
                      onChange={(e) => setDestinationLabel(e.target.value)}
                      placeholder={destination === 'external' ? 'https://...' : 'Name or short label'}
                    />
                    <div className="form-hint">Shown under the boosted video so viewers know where the link goes.</div>
                  </div>
                </div>
              </div>
            }

            {/* STEP 2 — AUDIENCE */}
            {step === 2 &&
              <div className="card card-body">
                <div className="section-title" style={{ marginBottom: 16 }}>Audience Targeting</div>
                <div className="form-group">
                  <label className="form-label">Location</label>
                  <input className="form-input" value={audience.location} onChange={(e) => setAudience((a) => ({ ...a, location: e.target.value }))} placeholder="e.g. Quezon City, NCR" />
                </div>
                <div className="form-group">
                  <label className="form-label">Age Range</label>
                  <div className="form-row">
                    <input className="form-input" type="number" value={audience.ageMin} onChange={(e) => setAudience((a) => ({ ...a, ageMin: e.target.value }))} placeholder="Min age" />
                    <input className="form-input" type="number" value={audience.ageMax} onChange={(e) => setAudience((a) => ({ ...a, ageMax: e.target.value }))} placeholder="Max age" />
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Gender</label>
                  <div className="toggle-group">
                    {['All', 'Male', 'Female'].map((g) =>
                      <div key={g} className={`toggle-option ${audience.gender === g ? 'selected' : ''}`} onClick={() => setAudience((a) => ({ ...a, gender: g }))}>{g}</div>
                    )}
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Skill Level (DUPR Brackets)</label>
                  <div className="skill-options">
                    {[
                      { label: 'Beginner', range: '2.0–3.0', key: 'Beginner 2.0–3.0' },
                      { label: 'Intermediate', range: '3.0–4.0', key: 'Intermediate 3.0–4.0' },
                      { label: 'Advanced', range: '4.0–5.0+', key: 'Advanced 4.0–5.0+' }
                    ].map((s) =>
                      <div key={s.key} className={`skill-option ${audience.skills.includes(s.key) ? 'selected' : ''}`} onClick={() => toggleSkill(s.key)}>
                        <div className={`skill-checkbox ${audience.skills.includes(s.key) ? 'checked' : ''}`}>
                          {audience.skills.includes(s.key) && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4" strokeLinecap="round"><polyline points="20 6 9 17 4 12" /></svg>}
                        </div>
                        <div>
                          <div className="skill-option-title">{s.label}</div>
                          <div className="skill-option-sub">DUPR Rating {s.range}</div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
                <div className="reach-box">
                  <span className="reach-icon">📊</span>
                  <div>
                    <div className="reach-label">Estimated Reach</div>
                    <div className="reach-value">~{(2200).toLocaleString()} users</div>
                  </div>
                </div>
              </div>
            }

            {/* STEP 3 — BUDGET */}
            {step === 3 &&
              <div className="card card-body">
                <div className="section-title" style={{ marginBottom: 16 }}>Budget & Duration</div>
                <div className="form-group">
                  <label className="form-label">Total Boost Budget</label>
                  <div className="budget-input-wrap">
                    <span className="budget-prefix">₱</span>
                    <input className="form-input budget-input" type="number" value={budget} onChange={(e) => setBudget(e.target.value)} placeholder="0" min="50" />
                  </div>
                  <div className="form-hint">Minimum boost: ₱50</div>
                </div>
                <div className="form-group">
                  <label className="form-label">Boost Duration</label>
                  <div className="duration-grid">
                    {[3, 5, 7, 14].map((d) =>
                      <div key={d} className={`duration-option ${duration === d ? 'selected' : ''}`} onClick={() => setDuration(d)}>
                        <div className="duration-option-days">{d}</div>
                        <div className="duration-option-label">days</div>
                      </div>
                    )}
                  </div>
                </div>
                <div className="cost-summary">
                  <div className="cost-row"><span>Daily Spend</span><span>{fmt(dailyCost)}/day</span></div>
                  <div className="cost-row"><span>Duration</span><span>{duration} days</span></div>
                  <div className="cost-row"><span>Est. Reach</span><span>~{reach.toLocaleString()} users</span></div>
                  <div className="cost-row"><span>Total Boost Cost</span><span style={{ color: '#DC2626' }}>{fmt(totalCost)}</span></div>
                </div>
                <div style={{ marginTop: 12, padding: '10px 14px', background: sufficientBalance ? '#FFFBEB' : '#FEF2F2', border: '1px solid ' + (sufficientBalance ? '#FDE68A' : '#FCA5A5'), borderRadius: 8, fontSize: 12, color: sufficientBalance ? '#92400E' : '#991B1B' }}>
                  {sufficientBalance ?
                    `🚀 Your Boost Wallet: ${fmt(boostBalance)} — this boost will use ${fmt(totalCost)} from your balance.` :
                    `⚠️ Insufficient Boost Wallet balance. You have ${fmt(boostBalance)} but need ${fmt(totalCost)}. Top up in the Wallet tab.`}
                </div>
              </div>
            }

            {/* STEP 4 — REVIEW */}
            {step === 4 &&
              <div className="card card-body">
                <div className="section-title" style={{ marginBottom: 16 }}>Review Your Boost</div>
                <div className="review-section">
                  <div className="review-section-title">Video & Destination</div>
                  <div className="review-item"><span className="review-item-label">Video</span><span className="review-item-value">{selectedVid?.title || '—'}</span></div>
                  <div className="review-item"><span className="review-item-label">Destination</span><span className="review-item-value">{dest?.icon} {dest?.label} · {destinationLabel}</span></div>
                </div>
                <div className="review-section">
                  <div className="review-section-title">Audience</div>
                  <div className="review-item"><span className="review-item-label">Location</span><span className="review-item-value">{audience.location}</span></div>
                  <div className="review-item"><span className="review-item-label">Age</span><span className="review-item-value">{audience.ageMin}–{audience.ageMax}</span></div>
                  <div className="review-item"><span className="review-item-label">Gender</span><span className="review-item-value">{audience.gender}</span></div>
                  <div className="review-item"><span className="review-item-label">Skill Level</span><span className="review-item-value">{audience.skills.join(', ') || 'All'}</span></div>
                </div>
                <div className="review-section">
                  <div className="review-section-title">Budget</div>
                  <div className="review-item"><span className="review-item-label">Total Budget</span><span className="review-item-value" style={{ color: '#DC2626' }}>{fmt(totalCost)}</span></div>
                  <div className="review-item"><span className="review-item-label">Duration</span><span className="review-item-value">{duration} days</span></div>
                  <div className="review-item"><span className="review-item-label">Est. Reach</span><span className="review-item-value">~{reach.toLocaleString()} users</span></div>
                </div>
                {sufficientBalance ?
                  <div style={{ marginTop: 16, padding: '12px 16px', background: '#E8F5E9', border: '1px solid #A7F3D0', borderRadius: 8, fontSize: 13, color: '#166534', lineHeight: 1.5 }}>
                    ✅ Ready to boost! Your video will start appearing in qualified feeds within 30 minutes.
                  </div> :
                  <div style={{ marginTop: 16, padding: '12px 16px', background: '#FEF2F2', border: '1px solid #FCA5A5', borderRadius: 8, fontSize: 13, color: '#991B1B', lineHeight: 1.5 }}>
                    ⚠️ Insufficient Boost Wallet balance ({fmt(boostBalance)}). Top up at least {fmt(totalCost - boostBalance)} more.
                  </div>
                }
              </div>
            }
          </div>

          <div className="wizard-phone-col">
            <PhoneMockup campaignName={selectedVid?.title || 'Your Boosted Video'} videoColor={selectedVid?.color || '#1a1a2e'} />
          </div>
        </div>

        <div className="wizard-footer">
          <button className="btn btn-outline" onClick={() => step > 1 ? setStep((s) => s - 1) : onClose()}>
            <Icon.ArrowLeft />{step > 1 ? 'Back' : 'Cancel'}
          </button>
          <div style={{ fontSize: 13, color: '#9CA3AF' }}>
            {!canNext() && step === 1 && 'Select a video & destination to continue'}
            {!canNext() && step === 3 && 'Enter a budget ≥ ₱50'}
          </div>
          {step < 4 ?
            <button className="btn btn-primary" onClick={() => canNext() && setStep((s) => s + 1)} style={{ opacity: canNext() ? 1 : .5, cursor: canNext() ? 'pointer' : 'not-allowed' }}>
              Next Step <Icon.ArrowRight />
            </button> :
            <button
              className="btn btn-primary"
              onClick={() => sufficientBalance && onLaunch({ videoId: selectedVideo, name: `${selectedVid?.title || 'Untitled'} boost`, budget: totalCost, destination, destinationLabel })}
              style={{ background: sufficientBalance ? '#DC2626' : '#9CA3AF', padding: '10px 24px', opacity: sufficientBalance ? 1 : .6, cursor: sufficientBalance ? 'pointer' : 'not-allowed' }}>
              {sufficientBalance ? '🚀 Launch Boost' : 'Insufficient Balance'}
            </button>
          }
        </div>
      </div>
    </div>);

}

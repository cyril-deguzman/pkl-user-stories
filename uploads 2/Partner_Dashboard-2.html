        <div className="f100-benefits">
          {FOUNDING_100.benefits.map((b, i) =>
            <div key={i} className="f100-benefit">
              <span className="f100-benefit-icon">{b.icon}</span>
              <span>
                <span className="f100-benefit-label">{b.label}</span>
                <span className="f100-benefit-detail">{b.detail}</span>
              </span>
            </div>
          )}
        </div>
        <div className="f100-status-row">
          {isMember ?
            <>
              <div className="f100-status-pill">✓ You're In · Member #{FOUNDING_100.cohortNumber}</div>
              <div style={{ flex: 1 }}></div>
              <div style={{ fontSize: 11, color: 'rgba(255,255,255,.55)' }}>Active since Apr 1, 2026</div>
            </> :
            <>
              <div className="f100-status-pill locked">🔒 Invite-only</div>
              <div style={{ flex: 1 }}></div>
              <button className="f100-cta-btn" onClick={onApply}>Request Invite →</button>
            </>
          }
        </div>
      </div>
    </div>);

}

// ─── TIER PROGRESSION CARD (dashboard block) ──────────────────────────────────
function TierProgressionCard({ currentTier, onOpenProgram }) {
  const nextTier = CREATOR_TIERS.find((t) => !t.locked && t.id > currentTier) ||
                   CREATOR_TIERS.find((t) => !t.locked);
  if (!nextTier) return null;
  const perMetric = nextTier.requirements.map((r) => {
    const have = CREATOR_METRICS[r.key] ?? 0;
    const pct = Math.min(100, Math.round(have / r.target * 100));
    return { ...r, have, pct, met: have >= r.target };
  });
  const overallPct = Math.round(perMetric.reduce((s, m) => s + m.pct, 0) / perMetric.length);
  const allMet = perMetric.every((m) => m.met);

  return (
    <div className="tier-prog-card">
      <div className="tier-prog-head">
        <div>
          <div className="tier-prog-eyebrow">Tier {nextTier.id} Progress</div>
          <div className="tier-prog-title">{nextTier.name}</div>
          <div className="tier-prog-sub">{nextTier.tag}</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div className="tier-prog-pill">{allMet ? '✓ Ready to apply' : `${overallPct}% there`}</div>
          <button className="btn btn-outline btn-sm" onClick={onOpenProgram}>View Program →</button>
        </div>
      </div>
      <div className="tier-prog-metrics">
        {perMetric.map((m) =>
          <div key={m.key}>
            <div className="tier-prog-metric-label">
              {m.met ? <span style={{ color: '#16A34A', fontSize: 14 }}>✓</span> : <span style={{ color: '#9CA3AF', fontSize: 14 }}>○</span>}
              {m.label}
            </div>
            <div className="tier-prog-have-row">
              <div className="tier-prog-metric-have">{m.have.toLocaleString()}</div>
              <div className="tier-prog-metric-target">/ {m.target.toLocaleString()}</div>
            </div>
            <div className="tier-prog-metric-bar">
              <div className={`tier-prog-metric-fill ${m.met ? 'met' : ''}`} style={{ width: m.pct + '%' }}></div>
            </div>
          </div>
        )}
      </div>
    </div>);

}

// ─── FOLLOWERS CARD ───────────────────────────────────────────────────────────
function FollowersCard() {
  return (
    <div className="followers-card" style={{ height: '100%' }}>
      <div className="followers-head">
        <div>
          <div className="stat-label">Followers · last 30d</div>
          <div style={{ marginTop: 6 }}>
            <span className="followers-stat">+{FOLLOWER_TOTAL_30D}</span>
            <span className="followers-delta">↑ +18%</span>
          </div>
          <div style={{ fontSize: 11, color: '#9CA3AF', marginTop: 2 }}>{CREATOR_METRICS.followers + FOLLOWER_TOTAL_30D} total followers</div>
        </div>
        <div style={{ fontSize: 24 }}>👥</div>
      </div>
      <div className="followers-bar">
        {FOLLOWER_SOURCES.map((s) =>
          <div key={s.source} className="followers-bar-seg" style={{ background: s.color, width: s.pct + '%' }}></div>
        )}
      </div>
      <div className="followers-legend">
        {FOLLOWER_SOURCES.map((s) =>
          <div key={s.source} className="followers-legend-row">
            <div className="followers-legend-dot" style={{ background: s.color }}></div>
            <div className="followers-legend-label">{s.source}</div>
            <div className="followers-legend-count">+{s.count}</div>
          </div>
        )}
      </div>
    </div>);

}


// ─── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [activeNav, setActiveNav] = useState('Dashboard');
  const [showWizard, setShowWizard] = useState(false);
  const [toast, setToast] = useState(null);
  const [campaigns, setCampaigns] = useState(INITIAL_CAMPAIGNS);
  const [walletBalance, setWalletBalance] = useState(2500);
  const [selectedCampaign, setSelectedCampaign] = useState(null);
  const [activeRole] = useState(() => localStorage.getItem('pklAccountType') || 'Advertiser'); // 'Advertiser' | 'Creator'
  const [creatorBalance, setCreatorBalance] = useState(3420);
  // Default verified when logging in as Creator; toggle Demo to explore unverified state
  const [isCreatorVerified, setIsCreatorVerified] = useState(false);
  const currentTier = isCreatorVerified ? 1 : 0; // demo user only qualifies for Tier 1
  // Which tab is active inside the Profile view — Creator Program now lives here
  const [profileTab, setProfileTab] = useState('profile'); // 'profile' | 'program'

  // ─── Creator boost state ──────────────────────────────────────────
  const [boosts, setBoosts] = useState(INITIAL_BOOSTS);
  const [boostBalance, setBoostBalance] = useState(320);
  const [showBoostWizard, setShowBoostWizard] = useState(false);
  const [boostPreselectId, setBoostPreselectId] = useState(null);
  // ─── Founding 100 demo state ──────────────────────────────────────
  // Independent of tier — invitation-only program
  const [isFounding100, setIsFounding100] = useState(false);

  const openCreatorProgram = () => {
    setActiveNav('Profile');
    setProfileTab('program');
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const handleSetVerified = (val) => {
    setIsCreatorVerified(val);
    showToast(val ? '✓ Verified as a Creator Partner (Tier 1)' : 'Switched back to unverified state');
  };

  const handleLaunch = (campaignData) => {
    setShowWizard(false);
    if (campaignData && campaignData.budget) {
      setWalletBalance((b) => Math.max(0, b - campaignData.budget));
    }
    showToast('🚀 Campaign launched successfully!');
  };

  const handleToggleStatus = (id) => {
    setCampaigns((cs) => cs.map((c) => {
      if (c.id !== id) return c;
      if (c.status === 'Active') return { ...c, status: 'Paused' };
      if (c.status === 'Paused') return { ...c, status: 'Active' };
      return c;
    }));
    const c = campaigns.find((x) => x.id === id);
    if (c) {
      showToast(c.status === 'Active' ? '⏸ Campaign paused' : '▶ Campaign resumed');
      // also update selectedCampaign so modal reflects new status
      setTimeout(() => {
        setSelectedCampaign((sc) => sc && sc.id === id ? { ...sc, status: c.status === 'Active' ? 'Paused' : 'Active' } : sc);
      }, 0);
    }
  };

  const handleTopUp = (amount) => {
    setWalletBalance((b) => b + amount);
    showToast(`💰 ₱${amount.toLocaleString()} added to your wallet`);
  };

  // ─── Boost handlers ───────────────────────────────────────────────
  const openBoostWizard = (videoId) => {
    setBoostPreselectId(videoId);
    setShowBoostWizard(true);
  };
  const handleLaunchBoost = (boostData) => {
    setShowBoostWizard(false);
    setBoostPreselectId(null);
    if (boostData && boostData.budget) {
      setBoostBalance((b) => Math.max(0, b - boostData.budget));
      setBoosts((bs) => [{
        id: Date.now(),
        videoId: boostData.videoId,
        name: boostData.name,
        status: 'Active',
        budget: boostData.budget,
        spent: 0, views: 0, clicks: 0, ctr: 0,
        created: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        destination: boostData.destination,
        destinationLabel: boostData.destinationLabel
      }, ...bs]);
    }
    showToast('🚀 Boost launched! Your video will start appearing in feeds soon.');
  };
  const handleToggleBoost = (id) => {
    setBoosts((bs) => bs.map((b) => {
      if (b.id !== id) return b;
      if (b.status === 'Active') return { ...b, status: 'Paused' };
      if (b.status === 'Paused') return { ...b, status: 'Active' };
      return b;
    }));
    const b = boosts.find((x) => x.id === id);
    if (b) showToast(b.status === 'Active' ? '⏸ Boost paused' : '▶ Boost resumed');
  };
  const handleBoostTopUp = (amount) => {
    setBoostBalance((b) => b + amount);
    showToast(`🚀 ₱${amount.toLocaleString()} added to your Boost Wallet`);
  };
  const handleApplyFounding = () => {
    showToast('✓ Invite request sent — we\'ll review and notify you within 7 days');
  };
  const toggleFounding100 = () => {
    setIsFounding100((v) => !v);
    showToast(!isFounding100 ? '⭐ You\'re now a Founding 100 member!' : 'Founding 100 status removed');
  };

  const activeCount = campaigns.filter((c) => c.status === 'Active').length;
  const showAdvertiser = activeRole === 'Advertiser';
  const showCreator = activeRole === 'Creator';

  const activeBoostCount = boosts.filter((b) => b.status === 'Active').length;
  const allNavItems = [
  { id: 'Dashboard', icon: <Icon.Dashboard />, label: 'Dashboard', roles: ['Advertiser', 'Creator'] },
  { id: 'Campaigns', icon: <Icon.Campaigns />, label: 'Campaigns', badge: String(activeCount), roles: ['Advertiser'] },
  { id: 'Boost', icon: <Icon.Boost />, label: 'Boost', badge: String(activeBoostCount), roles: ['Creator'], creatorGated: true },
  { id: 'Earnings', icon: <Icon.Earnings />, label: 'Earnings', roles: ['Creator'], creatorGated: true },
  { id: 'VideoLibrary', icon: <Icon.Library />, label: 'Video Library', roles: ['Advertiser', 'Creator'] },
  { id: 'Wallet', icon: <Icon.Wallet />, label: 'Wallet', roles: ['Advertiser'] },
  { id: 'CreatorWallet', icon: <Icon.Wallet />, label: 'Wallet', roles: ['Creator'], creatorGated: true },
  { id: 'Profile', icon: <Icon.Profile />, label: 'Profile', roles: ['Advertiser', 'Creator'] }];

  const navItems = allNavItems.filter((item) => item.roles.includes(activeRole));

  // Auto-redirect:
  //  - If on a creator-gated page but not verified → bounce to Profile → Creator Program tab
  //  - If activeRole is Creator and not verified, also bounce off Dashboard (can only see Profile)
  useEffect(() => {
    if (!navItems.some((n) => n.id === activeNav)) {
      setActiveNav(activeRole === 'Creator' && !isCreatorVerified ? 'Profile' : 'Dashboard');
      if (activeRole === 'Creator' && !isCreatorVerified) setProfileTab('program');
      return;
    }
    const cur = navItems.find((n) => n.id === activeNav);
    if (cur && cur.creatorGated && !isCreatorVerified) {
      setActiveNav('Profile');
      setProfileTab('program');
      return;
    }
    // Unverified creators are routed straight to Creator Program — no Dashboard until verified
    if (activeRole === 'Creator' && !isCreatorVerified && activeNav === 'Dashboard') {
      setActiveNav('Profile');
      setProfileTab('program');
    }
  }, [activeRole, isCreatorVerified, activeNav]);

  const handleNavClick = (item) => {
    if (item.creatorGated && !isCreatorVerified) {
      openCreatorProgram();
      showToast(`🔒 ${item.label} unlocks once you're a verified Creator Partner`);
      return;
    }
    if (item.id === 'Profile') {
      // Default to Profile tab when entering via the sidebar
      setActiveNav('Profile');
      setProfileTab('profile');
      return;
    }
    setActiveNav(item.id);
  };

  return (
    <div className="app">
      {/* SIDEBAR */}
      <div className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-mark">
            <img src="pkl-colored-icon.png" alt="" className="brand-icon" />
            <img src="pkl-life-logo.svg" alt="PKL Life" style={{ flex: 1, minWidth: 0, height: 'auto', maxHeight: 24, display: 'block', filter: 'drop-shadow(0 4px 12px rgba(220,38,38,.3))', marginLeft: -70 }} />
          </div>
          <div className="logo-sub">{activeRole === 'Creator' ? 'Creator Portal' : 'Advertiser Portal'}</div>
        </div>
        <div className="sidebar-nav">
          <div className="nav-section">Main</div>
          {navItems.map((item) => {
            const locked = item.creatorGated && !isCreatorVerified;
            return (
              <div
                key={item.id}
                className={`nav-item ${activeNav === item.id ? 'active' : ''} ${locked ? 'locked' : ''}`}
                onClick={() => handleNavClick(item)}
                title={locked ? 'Become a verified Creator Partner to unlock' : ''}>

                {item.icon}
                {item.label}
                {item.badge && !locked && <span className="nav-badge">{item.badge}</span>}
                {locked && <span className="nav-lock"><Icon.Lock /></span>}
              </div>);

          })}
        </div>
        {/* XP-style tier progress — always visible so users see how close they are to the next tier */}
        {activeRole === 'Creator' &&
        <div onClick={openCreatorProgram} style={{ cursor: 'pointer' }} title="View Creator Program">
            <TierProgressBar isCreatorVerified={isCreatorVerified} currentTier={currentTier} />
          </div>
        }
        <div className="sidebar-user">
          <div className="user-avatar"><img src="marcos_avatar.png" alt="Marcos Lim" /></div>
          <div className="user-info">
            <div className="user-name">
              Marcos Lim
              {isCreatorVerified && <span style={{ marginLeft: 5, color: '#EF4444', display: 'inline-flex', verticalAlign: 'middle' }}><Icon.Verified /></span>}
            </div>
            <div className="user-role">{activeRole === 'Creator' ? 'Creator Partner' : 'Advertiser Partner'}</div>
            {isFounding100 &&
            <span className="founding-badge">⭐ FOUNDING 100</span>
            }
          </div>
          <a
            href="Login.html"
            title="Sign out"
            style={{ width: 30, height: 30, display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: 8, color: 'rgba(255,255,255,.5)', textDecoration: 'none', flexShrink: 0, transition: 'all .15s' }}
            onMouseEnter={(e) => {e.currentTarget.style.background = 'rgba(220,38,38,.18)';e.currentTarget.style.color = '#fff';}}
            onMouseLeave={(e) => {e.currentTarget.style.background = 'transparent';e.currentTarget.style.color = 'rgba(255,255,255,.5)';}}>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width="16" height="16">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </a>
        </div>
      </div>

      {/* MAIN */}
      <div className="main">
        {activeNav === 'Dashboard' && <DashboardView onCreateCampaign={() => setShowWizard(true)} onNavigate={setActiveNav} onOpenCreatorProgram={openCreatorProgram} campaigns={campaigns} walletBalance={walletBalance} onSelectCampaign={setSelectedCampaign} activeRole={activeRole} creatorBalance={creatorBalance} boostBalance={boostBalance} boosts={boosts} isCreatorVerified={isCreatorVerified} onSetVerified={handleSetVerified} onBoostVideo={openBoostWizard} onBoostTopUp={handleBoostTopUp} isFounding100={isFounding100} onApplyFounding={handleApplyFounding} onToggleFounding={toggleFounding100} />}
        {activeNav === 'Campaigns' && <CampaignsView onCreateCampaign={() => setShowWizard(true)} campaigns={campaigns} onToggleStatus={handleToggleStatus} onSelectCampaign={setSelectedCampaign} />}
        {activeNav === 'Boost' && <BoostView onBoostVideo={openBoostWizard} boosts={boosts} onToggleStatus={handleToggleBoost} onSelectBoost={() => showToast('Boost detail view coming soon')} />}
        {activeNav === 'Earnings' && <EarningsView creatorBalance={creatorBalance} onNavigate={setActiveNav} />}
        {activeNav === 'VideoLibrary' && <VideoLibraryView activeRole={activeRole} isCreatorVerified={isCreatorVerified} onBoostVideo={openBoostWizard} />}
        {activeNav === 'Wallet' && <BillingView walletBalance={walletBalance} onTopUp={handleTopUp} />}
        {activeNav === 'CreatorWallet' && <CreatorWalletView creatorBalance={creatorBalance} boostBalance={boostBalance} onTopUp={handleBoostTopUp} onNavigate={setActiveNav} />}
        {activeNav === 'Profile' && <ProfileView profileTab={profileTab} setProfileTab={setProfileTab} isCreatorVerified={isCreatorVerified} currentTier={currentTier} onShowToast={showToast} onSetVerified={handleSetVerified} activeRole={activeRole} isFounding100={isFounding100} onApplyFounding={handleApplyFounding} onToggleFounding={toggleFounding100} />}
      </div>

      {/* WIZARD */}
      {showWizard && <CreateCampaignWizard onClose={() => setShowWizard(false)} onLaunch={handleLaunch} walletBalance={walletBalance} />}
      {showBoostWizard && <CreateBoostWizard onClose={() => { setShowBoostWizard(false); setBoostPreselectId(null); }} onLaunch={handleLaunchBoost} boostBalance={boostBalance} preselectedVideoId={boostPreselectId} />}

      {/* CAMPAIGN DETAIL */}
      <CampaignDetailModal campaign={selectedCampaign} onClose={() => setSelectedCampaign(null)} onToggleStatus={handleToggleStatus} />

      {/* TOAST */}
      {toast &&
      <div className="toast">
          {toast}
        </div>
      }
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
